name: govulncheck
on:
  push:
    paths:
      - go.sum
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # The action installs Go itself. Use the Go version of go.mod,
          # because govulncheck also reports the vulnerabilities of the
          # standard library of that version.
          go-version-file: go.mod
          # The default value "stable" has precedence over go-version-file.
          # See https://github.com/golang/go/issues/70036
          go-version-input: ""
          # The repository is already checked out above, without persisted
          # credentials
          repo-checkout: false
          go-package: ./...
