name: Release

on:
  push:
    tags:
      - "v*"

# Declare default permissions as read only.
permissions:
  contents: read

jobs:
  ci:
    name: Run CI
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]

  build-containers:
    name: Build, sign and attest container images
    permissions:
      contents: read # Checkout the source
      packages: write # Pushing images to ghcr.io
      id-token: write # Signing images with cosign and actions/attest
      attestations: write # actions/attest (SLSA L3 provenance)
    uses: kubewarden/github-actions/.github/workflows/container-release.yml@d12b2b18e1f9dbfe15c79c9ecb7149cf956704a7 # v8.1.0
    with:
      components: '["controller","processor"]'
      image-namespace: ${{ github.event.repository.name }}
      version: ${{ github.ref_name }}

  release:
    name: Create release
    needs:
      - ci
      - build-containers
    permissions:
      contents: write # Upload the assets and publish the release
    runs-on: ubuntu-latest
    steps:
      - name: Download attestation artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: attestation-*
          merge-multiple: true
      - name: Display structure of downloaded files
        run: ls -R
      - name: Upload release assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            // The release drafter keeps one draft release up to date.
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const draft = releases.data.find((release) => release.draft);
            if (!draft) {
              core.setFailed('Draft release not found');
              return;
            }
            core.exportVariable('RELEASE_ID', draft.id);

            // The names follow the output of container-release.yml. A
            // missing file makes readFileSync throw and stops the release.
            const files = [];
            for (const component of ['controller', 'processor']) {
              for (const arch of ['amd64', 'arm64']) {
                for (const name of [
                  `${component}-attestation-${arch}-provenance.intoto.jsonl`,
                  `${component}-attestation-${arch}-sbom.json`,
                ]) {
                  files.push(name, `${name}.bundle.sigstore`);
                }
              }
            }

            for (const file of files) {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draft.id,
                name: file,
                data: fs.readFileSync(file),
              });
            }
      - name: Publish release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const { RELEASE_ID, TAG_NAME } = process.env;
            const isPreRelease = ['-alpha', '-beta', '-rc'].some((suffix) => TAG_NAME.includes(suffix));

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: RELEASE_ID,
              draft: false,
              tag_name: TAG_NAME,
              name: TAG_NAME,
              prerelease: isPreRelease,
              make_latest: isPreRelease ? 'false' : 'true',
            });
