name: Update agentgateway

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1" # 3:30 on Monday

permissions: {}

jobs:
  update-agentgateway:
    name: Update agentgateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@8aa7bec31d6463e47c947f06c6b1df7dba276e07 # v3.11.0

      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # minimum permissions for updatecli to push a branch and open a PR:
          permission-contents: write
          permission-pull-requests: write
          permission-members: read # request reviews from the teams in .pr.reviewers

      - name: Update agentgateway
        env:
          UPDATECLI_GITHUB_OWNER: ${{ github.repository_owner }}
          UPDATECLI_GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |-
          updatecli compose apply --file ./updatecli/update-agentgateway.yaml
