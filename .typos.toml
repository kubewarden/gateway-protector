[files]
extend-exclude = [
  "charts/*/templates/crd/",
  "docs/crds/CRD-docs-for-docs-repo.*",
  "hack/check-for-auto-generated-changes.sh",
  "internal/configstream/v1/*.pb.go",
  "go.mod",
  "go.sum",
]

[default.extend-words]
# Names of golangci-lint linters, listed in .golangci.yml
decorder = "decorder"
importas = "importas"

[default]
extend-ignore-re = [
  # Ignore base64 encoded strings (certificates, keys, etc.)
  '[A-Za-z0-9+/]{20,}={0,2}',
]
