version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/kubewarden/gateway-protector/internal
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: internal
    opt: paths=source_relative
