apiVersion: v2
name: gateway-protector
description: A Kubernetes-native WAF + DLP control plane and data plane for the agentgateway implementation of the Gateway API.
icon: https://www.kubewarden.io/images/icon-kubewarden.svg
type: application
# The same minimum version as the other Kubewarden charts.
kubeVersion: ">= 1.31.0-0"
keywords:
  - Kubewarden
  - Security
  - WAF
  - DLP
  - Gateway API
  - agentgateway
home: https://www.kubewarden.io/
maintainers:
  - name: Kubewarden Maintainers
    email: cncf-kubewarden-maintainers@lists.cncf.io
    url: https://github.com/orgs/kubewarden/teams/maintainers
# This is the chart version. The release PR sets it to the release version
# without the "v" prefix.
version: 0.1.0
# This is the version of Gateway Protector. The release PR sets it.
appVersion: "0.1.0"

annotations:
  # required ones:
  catalog.cattle.io/certified: rancher # Any application we are adding as a helm chart
  catalog.cattle.io/namespace: cattle-gateway-protector-system # Must prefix with cattle- and suffix with -system
  catalog.cattle.io/release-name: rancher-gateway-protector # If this is an upstream app, prefixing with rancher is the preferred naming choice.
  catalog.cattle.io/ui-component: gateway-protector # This is added for custom UI deployment of a chart
  catalog.cattle.io/display-name: GatewayProtector # Only for Charts with custom UI
  catalog.cattle.io/os: linux # this means linux only, other choice here is "windows". For charts that support both, don't add this annotation
  # optional ones:
  catalog.cattle.io/provides-gvr: "wafpolicies.gateway-protector.kubewarden.io/v1alpha1" # Declare that this chart provides a type, which other charts may use in `requires-gvr`. Only add to parent, not CRD chart.
  # The following two will create a UI warning if the request is not available in cluster
  # Assume the most standard setup for your chart. These can be strings with amounts, ie 64Mi or 2Gi are both valid.
  # These are the sums of the default requests of the controller and the processor.
  catalog.cattle.io/requests-cpu: "200m"
  catalog.cattle.io/requests-memory: "256Mi"
  catalog.cattle.io/rancher-version: ">= 2.6.0-0 <= 2.16.100-0" # Chart will only be available for users in the specified Rancher version(s). This _must_ use build metadata or it won't work correctly for future RC's.
  # Valid values for the following annotation include: `cluster-tool`, `app` or `cluster-template`
  # See the Cluster Tools section to learn more about when to set this value to `cluster-tool`.
  catalog.cattle.io/type: cluster-tool
  # List of images that the chart can deploy. Artifact Hub uses this list to
  # link the images to the correct security report, because Artifact Hub can
  # find only the images from a dry-run install with default values.
  # The release PR keeps the tags in sync with values.yaml.
  # Reference: https://artifacthub.io/docs/topics/annotations/helm/
  artifacthub.io/images: |
    - name: controller
      image: ghcr.io/kubewarden/gateway-protector/controller:latest
    - name: processor
      image: ghcr.io/kubewarden/gateway-protector/processor:latest
