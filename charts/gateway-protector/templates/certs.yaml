# This template generates and rotates, with no cert-manager dependency,
# the CA and leaf certificates that secure both mTLS connections in this
# chart: the config stream between the controller and the processor, and
# the ext_proc connection between agentgateway and the processor. The
# ongoing rotation - not just the initial bootstrap this template handles -
# is done by the controller.
#
# Secret names and data keys here must match internal/certs/constants.go.

{{ $namespace := include "gateway-protector.namespace" . }}

{{ $ca := genCAWithKey "gateway-protector-ca" 3650 (genPrivateKey "ecdsa") }}
{{ $caCert := ($ca.Cert | b64enc) }}
{{ $caPrivateKey := ($ca.Key | b64enc) }}
{{ $caBundle := $caCert }}

{{ $oldCaCert := "" }}
{{ $controllerCert := "" }}
{{ $controllerKey := "" }}
{{ $processorCert := "" }}
{{ $processorKey := "" }}
{{ $processorServerCert := "" }}
{{ $processorServerKey := "" }}
{{ $agentgatewayClientCert := "" }}
{{ $agentgatewayClientKey := "" }}

{{ $caSecret := (lookup "v1" "Secret" $namespace "gateway-protector-ca") }}
{{ if $caSecret }}
{{ $caCert = (index $caSecret.data "tls.crt") }}
{{ $caPrivateKey = (index $caSecret.data "tls.key") }}
# If the old CA certificate is missing, default it to "" to avoid issues with
# b64dec below - it may be absent on a fresh install, or removed by
# CertReconciler once it expired.
{{ $oldCaCert = (index $caSecret.data "old-ca.crt" | default "") }}
{{ $caBundle = printf "%s%s" ($caCert | b64dec) ($oldCaCert | b64dec) | b64enc }}
{{ $ca = buildCustomCert $caCert $caPrivateKey }}
{{ end }}

{{ $controllerServiceDNSName := printf "gateway-protector-controller-config-stream.%s.svc" $namespace }}

{{ $controllerCertSecret := (lookup "v1" "Secret" $namespace "gateway-protector-controller-cert") }}
{{ if $controllerCertSecret }}
{{ $controllerCert = (index $controllerCertSecret.data "tls.crt") }}
{{ $controllerKey = (index $controllerCertSecret.data "tls.key") }}
{{ else }}
{{ $controllerCertKeyPair := genSignedCertWithKey $controllerServiceDNSName nil (list $controllerServiceDNSName) 365 $ca (genPrivateKey "ecdsa") }}
{{ $controllerCert = ($controllerCertKeyPair.Cert | b64enc) }}
{{ $controllerKey = ($controllerCertKeyPair.Key | b64enc) }}
{{ end }}

{{ $processorCertSecret := (lookup "v1" "Secret" $namespace "gateway-protector-processor-client-cert") }}
{{ if $processorCertSecret }}
{{ $processorCert = (index $processorCertSecret.data "tls.crt") }}
{{ $processorKey = (index $processorCertSecret.data "tls.key") }}
{{ else }}
{{ $processorCertKeyPair := genSignedCertWithKey "gateway-protector-processor-client" nil (list "gateway-protector-processor-client") 365 $ca (genPrivateKey "ecdsa") }}
{{ $processorCert = ($processorCertKeyPair.Cert | b64enc) }}
{{ $processorKey = ($processorCertKeyPair.Key | b64enc) }}
{{ end }}

{{ $processorServiceDNSName := printf "gateway-protector-processor.%s.svc" $namespace }}

{{ $processorServerCertSecret := (lookup "v1" "Secret" $namespace "gateway-protector-processor-server-cert") }}
{{ if $processorServerCertSecret }}
{{ $processorServerCert = (index $processorServerCertSecret.data "tls.crt") }}
{{ $processorServerKey = (index $processorServerCertSecret.data "tls.key") }}
{{ else }}
{{ $processorServerCertKeyPair := genSignedCertWithKey $processorServiceDNSName nil (list $processorServiceDNSName) 365 $ca (genPrivateKey "ecdsa") }}
{{ $processorServerCert = ($processorServerCertKeyPair.Cert | b64enc) }}
{{ $processorServerKey = ($processorServerCertKeyPair.Key | b64enc) }}
{{ end }}

{{ $agentgatewayClientCertSecret := (lookup "v1" "Secret" $namespace "gateway-protector-agentgateway-client-cert") }}
{{ if $agentgatewayClientCertSecret }}
{{ $agentgatewayClientCert = (index $agentgatewayClientCertSecret.data "tls.crt") }}
{{ $agentgatewayClientKey = (index $agentgatewayClientCertSecret.data "tls.key") }}
{{ else }}
{{ $agentgatewayClientCertKeyPair := genSignedCertWithKey "gateway-protector-agentgateway-client" nil (list "gateway-protector-agentgateway-client") 365 $ca (genPrivateKey "ecdsa") }}
{{ $agentgatewayClientCert = ($agentgatewayClientCertKeyPair.Cert | b64enc) }}
{{ $agentgatewayClientKey = ($agentgatewayClientCertKeyPair.Key | b64enc) }}
{{ end }}

apiVersion: v1
kind: Secret
metadata:
  name: gateway-protector-ca
  namespace: {{ include "gateway-protector.namespace" . | quote }}
  labels:
    {{ include "gateway-protector.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
type: kubernetes.io/tls
data:
  tls.crt: {{ $caCert }}
  tls.key: {{ $caPrivateKey }}
  {{- if $oldCaCert }}
  old-ca.crt: {{ $oldCaCert }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-protector-controller-cert
  namespace: {{ include "gateway-protector.namespace" . | quote }}
  labels:
    {{ include "gateway-protector.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
type: kubernetes.io/tls
data:
  tls.crt: {{ $controllerCert }}
  tls.key: {{ $controllerKey }}
  ca.crt: {{ $caBundle }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-protector-processor-client-cert
  namespace: {{ include "gateway-protector.namespace" . | quote }}
  labels:
    {{ include "gateway-protector.labels" . | nindent 4 }}
    app.kubernetes.io/component: processor
type: kubernetes.io/tls
data:
  tls.crt: {{ $processorCert }}
  tls.key: {{ $processorKey }}
  ca.crt: {{ $caBundle }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-protector-processor-server-cert
  namespace: {{ include "gateway-protector.namespace" . | quote }}
  labels:
    {{ include "gateway-protector.labels" . | nindent 4 }}
    app.kubernetes.io/component: processor
type: kubernetes.io/tls
data:
  tls.crt: {{ $processorServerCert }}
  tls.key: {{ $processorServerKey }}
  ca.crt: {{ $caBundle }}
---
# Every leaf/CA Secret in this file is typed kubernetes.io/tls: the type
# only requires tls.crt/tls.key to be present, extra keys (ca.crt,
# old-ca.crt) are allowed - cert-manager itself ships Secrets shaped
# exactly like this - and it lets kubectl/tooling recognize them as TLS
# material. This one additionally has to be kubernetes.io/tls because
# agentgateway's AgentgatewayPolicy backend.tls.mtlsCertificateRef expects
# that Secret type.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-protector-agentgateway-client-cert
  namespace: {{ include "gateway-protector.namespace" . | quote }}
  labels:
    {{ include "gateway-protector.labels" . | nindent 4 }}
    app.kubernetes.io/component: processor
type: kubernetes.io/tls
data:
  tls.crt: {{ $agentgatewayClientCert }}
  tls.key: {{ $agentgatewayClientKey }}
---
# agentgateway's AgentgatewayPolicy backend.tls.caCertificateRefs only
# accepts ConfigMaps, never Secrets - so the CA bundle is duplicated here
# alongside the ca.crt key already carried by every leaf Secret above.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-protector-ca-bundle
  namespace: {{ include "gateway-protector.namespace" . | quote }}
  labels:
    {{ include "gateway-protector.labels" . | nindent 4 }}
    app.kubernetes.io/component: processor
data:
  ca.crt: {{ $caBundle | b64dec | quote }}
