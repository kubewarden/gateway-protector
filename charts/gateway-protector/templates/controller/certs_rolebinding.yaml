apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gateway-protector.fullname" . }}-controller-certs
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "gateway-protector.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gateway-protector.fullname" . }}-controller-certs
subjects:
  - kind: ServiceAccount
    name: {{ include "gateway-protector.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
