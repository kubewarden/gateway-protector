apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway-protector.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "gateway-protector.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  selector:
    matchLabels:
      {{ include "gateway-protector.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  replicas: {{ .Values.controller.replicas }}
  template:
    metadata:
      labels:
        {{ include "gateway-protector.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      containers:
        - command:
            - /controller
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --config-stream-bind-address=:9002
            - --config-stream-cert-dir=/certs
          image: '{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}'
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          name: controller
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            {{ include "gateway-protector.securityContext" . | nindent 12 }}
          ports:
            - name: config-stream
              containerPort: 9002
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if and .Values.controller .Values.controller.resources }}
          resources:
{{ toYaml .Values.controller.resources | indent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: "/tmp"
              name: tmp
            - mountPath: "/certs"
              name: certs
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: certs
          secret:
            secretName: gateway-protector-controller-cert
      serviceAccountName: {{ include "gateway-protector.fullname" . }}-controller
      terminationGracePeriodSeconds: 10
