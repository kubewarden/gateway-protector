apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gateway-protector.fullname" . }}-controller-metrics-auth
  labels:
    {{ include "gateway-protector.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gateway-protector.fullname" . }}-controller-metrics-auth
subjects:
- kind: ServiceAccount
  name: {{ include "gateway-protector.fullname" . }}-controller
  namespace: {{ include "gateway-protector.namespace" . | quote }}
