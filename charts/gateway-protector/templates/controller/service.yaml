apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway-protector.fullname" . }}-controller-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway-protector.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  ports:
  - name: https
    port: 8443
    targetPort: 8443
  selector:
    {{- include "gateway-protector.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
