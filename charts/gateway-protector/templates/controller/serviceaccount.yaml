{{- $ctx := dict "root" $ "workload" "controller" "component" "controller" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gateway-protector.fullname" . }}-controller
  namespace: {{ include "gateway-protector.namespace" . | quote }}
  labels:
    {{- include "gateway-protector.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with include "gateway-protector.serviceAccountAnnotations" $ctx }}{{ . | nindent 2 }}{{ end }}
