---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
    helm.sh/resource-policy: keep
  name: wafpolicies.gateway-protector.kubewarden.io
spec:
  group: gateway-protector.kubewarden.io
  names:
    kind: WAFPolicy
    listKind: WAFPolicyList
    plural: wafpolicies
    singular: wafpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.kind
      name: Target Kind
      type: string
    - jsonPath: .spec.targetRef.name
      name: Target Name
      type: string
    - jsonPath: .spec.engine.mode
      name: Mode
      type: string
    - jsonPath: .status.conditions[?(@.type=='Accepted')].status
      name: Accepted
      type: string
    - jsonPath: .status.conditions[?(@.type=='Programmed')].status
      name: Programmed
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WAFPolicy is the Schema for the wafpolicies API. It attaches a Coraza +
          OWASP Core Rule Set WAF engine to a Gateway (as the default for all its
          routes) or to a single HTTPRoute (as an override of the Gateway default).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of WAFPolicy
            properties:
              anomalyThreshold:
                description: |-
                  anomalyThreshold sets the inbound/outbound anomaly score thresholds.
                  Absent means the Core Rule Set's own defaults.
                properties:
                  inbound:
                    description: inbound is the anomaly score threshold applied to
                      the request phase.
                    format: int32
                    type: integer
                  outbound:
                    description: outbound is the anomaly score threshold applied to
                      the response phase.
                    format: int32
                    type: integer
                type: object
              customRulesRefs:
                description: |-
                  customRulesRefs references WAFRuleSet objects, in the same namespace as
                  this WAFPolicy, whose custom SecRule directives are compiled into the
                  engine alongside the Core Rule Set. Referenced WAFRuleSets are
                  rendered in namespace/name order, not the order listed here (this is
                  a listType=map, so list order isn't meaningful and isn't preserved
                  across a server-side-apply merge); SecLang rules that depend on a
                  specific relative order must be placed together within a single
                  WAFRuleSet, whose own spec.rules order is preserved.
                items:
                  description: |-
                    LocalRuleSetReference references a WAFRuleSet living in the same namespace
                    as the WAFPolicy that references it (see WAFPolicySpec.CustomRulesRefs).
                  properties:
                    name:
                      description: |-
                        name is the name of the referenced WAFRuleSet, in the same namespace
                        as the WAFPolicy referencing it.
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              engine:
                description: engine configures the WAF engine's mode and failure posture.
                properties:
                  mode:
                    description: mode selects whether the engine blocks, only logs,
                      or is disabled.
                    enum:
                    - Blocking
                    - Detection
                    - "Off"
                    type: string
                required:
                - mode
                type: object
              exclusions:
                description: |-
                  exclusions silence specific CRS rules (by id or tag), e.g. to resolve a
                  known false positive without lowering the paranoia level.
                items:
                  description: |-
                    WAFExclusion excludes specific CRS rules (by numeric id) or rule tags from
                    evaluation, e.g. to silence a known false positive.
                  properties:
                    byId:
                      description: byId excludes specific CRS rule ids.
                      items:
                        format: int32
                        type: integer
                      type: array
                    byTag:
                      description: |-
                        byTag excludes every CRS rule carrying one of the given tags (e.g.
                        "attack-sqli").
                      items:
                        type: string
                      type: array
                  type: object
                type: array
              paranoiaLevel:
                description: |-
                  paranoiaLevel selects the CRS paranoia level (1-4); higher levels
                  enable more (and more false-positive-prone) rules. Absent means the
                  Core Rule Set's own default (paranoia level 1).
                format: int32
                maximum: 4
                minimum: 1
                type: integer
              requestBody:
                description: requestBody configures request body inspection.
                properties:
                  enabled:
                    description: enabled toggles body inspection for this phase.
                    type: boolean
                  maxSize:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      maxSize caps the number of bytes buffered for inspection (e.g. "1Mi").
                      Bodies larger than this are handled per the engine's configured
                      behavior for oversized bodies. Only meaningful when enabled is true.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                required:
                - enabled
                type: object
              responseBody:
                description: responseBody configures response body inspection.
                properties:
                  enabled:
                    description: enabled toggles body inspection for this phase.
                    type: boolean
                  maxSize:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      maxSize caps the number of bytes buffered for inspection (e.g. "1Mi").
                      Bodies larger than this are handled per the engine's configured
                      behavior for oversized bodies. Only meaningful when enabled is true.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                required:
                - enabled
                type: object
              targetRef:
                description: |-
                  targetRef identifies exactly one Gateway (applies to all its routes,
                  the common default case) or one HTTPRoute (overrides the Gateway
                  default for that route only).
                properties:
                  group:
                    description: group is the group of the target resource.
                    maxLength: 253
                    pattern: ^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  kind:
                    description: |-
                      kind is the kind of the target resource. Only "Gateway" and "HTTPRoute"
                      (group gateway.networking.k8s.io) are supported.
                    enum:
                    - Gateway
                    - HTTPRoute
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                    type: string
                  name:
                    description: name is the name of the target resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      namespace is the namespace of the target resource. WAFPolicy/DLPPolicy
                      objects live in the platform-owned namespace (e.g.
                      gateway-protector-system) while the targeted Gateway/HTTPRoute usually
                      lives elsewhere, so this field is required to let the controller
                      resolve cross-namespace targets unambiguously.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  sectionName:
                    description: |-
                      sectionName targets a specific listener (when kind is Gateway) or a
                      specific route rule (when kind is HTTPRoute). When unset, the policy
                      applies to the whole Gateway/HTTPRoute.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - group
                - kind
                - name
                - namespace
                type: object
            required:
            - engine
            - targetRef
            type: object
          status:
            description: status defines the observed state of WAFPolicy
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the WAFPolicy resource, using
                  the Gateway API status-conditions convention: Accepted (valid, target
                  resolves, not conflicted - see ConditionReasonConflicted) and
                  Programmed (gateway wired, engine live in the data plane).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
