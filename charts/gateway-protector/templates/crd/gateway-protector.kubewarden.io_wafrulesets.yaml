---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
    helm.sh/resource-policy: keep
  name: wafrulesets.gateway-protector.kubewarden.io
spec:
  group: gateway-protector.kubewarden.io
  names:
    kind: WAFRuleSet
    listKind: WAFRuleSetList
    plural: wafrulesets
    singular: wafruleset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WAFRuleSet is the Schema for the wafrulesets API. It is a reusable bundle
          of custom SecRule directives referenced from one or more WAFPolicy objects
          in the same namespace via customRulesRefs.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of WAFRuleSet
            properties:
              rules:
                description: |-
                  rules are raw Coraza/ModSecurity SecRule directive blocks, referenced
                  from WAFPolicy.customRulesRefs to avoid pasting raw directives inline
                  in every WAFPolicy.
                items:
                  description: |-
                    WAFCustomRule is a single raw Coraza/ModSecurity SecRule directive block,
                    identified by its numeric rule id.
                  properties:
                    directive:
                      description: directive is one or more raw SecRule lines composing
                        this rule.
                      minLength: 1
                      type: string
                    id:
                      description: |-
                        id is the numeric SecRule id. It must be in the site-local range
                        1-99999, which is the SecLang convention reserved for a site's own
                        custom rules (as opposed to 100000-899999, historically assigned to
                        various commercial/community rule vendors; 900000-999999, the OWASP
                        Core Rule Set itself; 9500000-9599999, registered CRS plugins; and
                        10000000-10000099, reserved by gateway-protector for its own
                        generated directives). It is
                        the author's responsibility to keep ids unique within a WAFRuleSet
                        and across every other WAFRuleSet referenced by the same WAFPolicy.

                        This validates the declared id field only, not any id that might
                        also appear inside the raw directive text below - a mismatch between
                        the two is still only caught at dry-compile time.
                      format: int64
                      type: integer
                      x-kubernetes-validations:
                      - message: rule id must be a positive integer
                        rule: self >= 1
                      - message: ids above 99999 are reserved (100000-899999 historical
                          vendor assignments, 900000-999999 OWASP Core Rule Set, 9500000-9599999
                          CRS plugins, 10000000-10000099 gateway-protector); custom
                          rules must use the site-local range 1-99999
                        rule: self <= 99999
                  required:
                  - directive
                  - id
                  type: object
                minItems: 1
                type: array
            required:
            - rules
            type: object
          status:
            description: status defines the observed state of WAFRuleSet
            properties:
              conditions:
                description: conditions represent the current state of the WAFRuleSet
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
