apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gateway-protector.fullname" . }}-processor-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "gateway-protector.labels" . | nindent 4 }}
    app.kubernetes.io/component: processor
data:
  config.yaml: |
{{ toYaml .Values.processor.config | indent 4 }}
