apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway-protector.fullname" . }}-processor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway-protector.labels" . | nindent 4 }}
    app.kubernetes.io/component: processor
spec:
  ports:
  - name: grpc
    port: 9000
    targetPort: 9000
  selector:
    {{- include "gateway-protector.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: processor
