apiVersion: v1
kind: Service
metadata:
  # The name is deliberately fixed rather than derived from the Helm
  # release: the controller generates AgentgatewayPolicy objects whose
  # ext_proc backendRef points at this Service by name (see
  # internal/controller/processor_config_wiring.go's ProcessorServiceName),
  # exactly like the hardcoded processor ConfigMap name.
  name: gateway-protector-processor
  namespace: {{ include "gateway-protector.namespace" . | quote }}
  labels:
    {{- include "gateway-protector.labels" . | nindent 4 }}
    app.kubernetes.io/component: processor
spec:
  ports:
  - name: grpc
    port: 9000
    targetPort: 9000
  selector:
    {{- include "gateway-protector.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: processor
