{{- $ctx := dict "root" $ "workload" "processor" "component" "processor" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gateway-protector.fullname" . }}-processor
  namespace: {{ include "gateway-protector.namespace" . | quote }}
  labels:
    {{- include "gateway-protector.labels" . | nindent 4 }}
    app.kubernetes.io/component: processor
  {{- with include "gateway-protector.serviceAccountAnnotations" $ctx }}{{ . | nindent 2 }}{{ end }}
automountServiceAccountToken: false
