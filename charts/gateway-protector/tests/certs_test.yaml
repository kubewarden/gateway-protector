  - it: should keep the existing leaf certificates on an upgrade
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: gateway-protector-controller-cert
            namespace: gateway-protector-system
          data:
            tls.crt: Y29udHJvbGxlci1jZXJ0
            tls.key: Y29udHJvbGxlci1rZXk=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: gateway-protector-processor-client-cert
            namespace: gateway-protector-system
          data:
            tls.crt: cHJvY2Vzc29yLWNsaWVudC1jZXJ0
            tls.key: cHJvY2Vzc29yLWNsaWVudC1rZXk=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: gateway-protector-processor-server-cert
            namespace: gateway-protector-system
          data:
            tls.crt: cHJvY2Vzc29yLXNlcnZlci1jZXJ0
            tls.key: cHJvY2Vzc29yLXNlcnZlci1rZXk=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: gateway-protector-agentgateway-client-cert
            namespace: gateway-protector-system
          data:
            tls.crt: YWdlbnRnYXRld2F5LWNsaWVudC1jZXJ0
            tls.key: YWdlbnRnYXRld2F5LWNsaWVudC1rZXk=
    asserts:
      - documentIndex: 1
        isSubset:
          path: data
          content:
            tls.crt: Y29udHJvbGxlci1jZXJ0
            tls.key: Y29udHJvbGxlci1rZXk=
      - documentIndex: 2
        isSubset:
          path: data
          content:
            tls.crt: cHJvY2Vzc29yLWNsaWVudC1jZXJ0
            tls.key: cHJvY2Vzc29yLWNsaWVudC1rZXk=
      - documentIndex: 3
        isSubset:
          path: data
          content:
            tls.crt: cHJvY2Vzc29yLXNlcnZlci1jZXJ0
            tls.key: cHJvY2Vzc29yLXNlcnZlci1rZXk=
      - documentIndex: 4
        isSubset:
          path: data
          content:
