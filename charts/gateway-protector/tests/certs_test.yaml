suite: certificates
templates:
  - certs.yaml
release:
  name: gateway-protector
  namespace: gateway-protector-system
tests:
  # The names must match the constants in internal/certs/constants.go.
  - it: should create the CA, the leaf certificates, and the CA bundle
    asserts:
      - hasDocuments:
          count: 6
      - documentIndex: 0
        equal:
          path: metadata.name
          value: gateway-protector-ca
      - documentIndex: 1
        equal:
          path: metadata.name
          value: gateway-protector-controller-cert
      - documentIndex: 2
        equal:
          path: metadata.name
          value: gateway-protector-processor-client-cert
      - documentIndex: 3
        equal:
          path: metadata.name
          value: gateway-protector-processor-server-cert
      - documentIndex: 4
        equal:
          path: metadata.name
          value: gateway-protector-agentgateway-client-cert
      - documentIndex: 5
        isKind:
          of: ConfigMap
      - documentIndex: 5
        equal:
          path: metadata.name
          value: gateway-protector-ca-bundle

  - it: should create all the objects in the release namespace
    release:
      namespace: custom-namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-namespace

  # agentgateway requires the kubernetes.io/tls type for its client certificate.
  - it: should give each Secret the kubernetes.io/tls type
    documentSelector:
      path: kind
      value: Secret
      matchMany: true
    asserts:
      - equal:
          path: type
          value: kubernetes.io/tls
      - isNotNullOrEmpty:
          path: data["tls.crt"]
      - isNotNullOrEmpty:
          path: data["tls.key"]

  - it: should add the CA bundle to each leaf Secret that verifies a peer
    asserts:
      - documentIndex: 1
        isNotNullOrEmpty:
          path: data["ca.crt"]
      - documentIndex: 2
        isNotNullOrEmpty:
          path: data["ca.crt"]
      - documentIndex: 3
        isNotNullOrEmpty:
          path: data["ca.crt"]
      - documentIndex: 4
        notExists:
          path: data["ca.crt"]

  - it: should put the CA bundle in the ConfigMap in PEM format
    documentIndex: 5
    asserts:
      - matchRegex:
          path: data["ca.crt"]
          pattern: ^-----BEGIN CERTIFICATE-----
      - notExists:
          path: data["tls.key"]

  - it: should not have an old CA certificate on a new installation
    documentIndex: 0
    asserts:
      - notExists:
          path: data["old-ca.crt"]

  - it: should label the certificates of each component
    asserts:
      - documentIndex: 0
        equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: controller
      - documentIndex: 1
        equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: controller
      - documentIndex: 2
        equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: processor
      - documentIndex: 3
        equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: processor
      - documentIndex: 4
        equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: processor

  # On an upgrade, the chart must keep the certificates that the controller
  # rotates. New certificates would break the mTLS connections until each
  # pod restarts.
  - it: should keep the existing CA on an upgrade
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: gateway-protector-ca
            namespace: gateway-protector-system
          data:
            tls.crt: 
            tls.key: 
    documentIndex: 0
    asserts:
      - equal:
          path: data["tls.crt"]
          value: 
      - equal:
          path: data["tls.key"]
          value: 
      - notExists:
          path: data["old-ca.crt"]

  - it: should trust the current and the old CA during a CA rotation
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: gateway-protector-ca
            namespace: gateway-protector-system
          data:
            tls.crt: 
            tls.key: 
            old-ca.crt: 
    asserts:
      - documentIndex: 0
        equal:
          path: data["old-ca.crt"]
          value: 
      - documentIndex: 1
        equal:
          path: data["ca.crt"]
          value: 
      - documentIndex: 2
        equal:
          path: data["ca.crt"]
          value: 
      - documentIndex: 3
        equal:
          path: data["ca.crt"]
          value: 
      - documentIndex: 5
        equal:
          path: data["ca.crt"]
          value: |
            -----BEGIN CERTIFICATE-----
            MIIBfjCCASSgAwIBAgIUL08Hj3rdrCwGT2otIJ/SbsxipaIwCgYIKoZIzj0EAwIw
            JDEiMCAGA1UEAwwZZ2F0ZXdheS1wcm90ZWN0b3ItdGVzdC1jYTAgFw0yNjExMjAx
            NjI3NDRaGA8yMTI2MTAyNzE2Mjc0NFowJDEiMCAGA1UEAwwZZ2F0ZXdheS1wcm90
