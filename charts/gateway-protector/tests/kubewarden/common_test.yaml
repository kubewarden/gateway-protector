suite: "Values contract: common"
templates:
  - "templates/controller/deployment.yaml"
  - "templates/processor/deployment.yaml"
tests:
  - it: "should render common.logLevel on every workload"
    set:
      common:
        logLevel: warn
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].args"
          content: "--log-level=warn"

  - it: "should render common.tolerations on every workload"
    set:
      common:
        tolerations:
          - operator: Exists
    asserts:
      - equal:
          path: "spec.template.spec.tolerations"
          value:
            - operator: Exists

  - it: "should render common.nodeSelector on every workload"
    set:
      common:
        nodeSelector:
          kubernetes.io/os: linux
    asserts:
      - equal:
          path: "spec.template.spec.nodeSelector"
          value:
            kubernetes.io/os: linux

  - it: "should render common.extraEnv on every workload"
    set:
      common:
        extraEnv:
          - name: FROM_COMMON
            value: "yes"
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].env"
          content:
            name: FROM_COMMON
            value: "yes"

  # gateway-protector cases
  - it: "should render common.imagePullSecrets on every workload"
    set:
      common:
        imagePullSecrets:
          - name: registry-credentials
    asserts:
      - equal:
          path: "spec.template.spec.imagePullSecrets"
          value:
            - name: registry-credentials

  - it: "should accept plain Secret names in common.imagePullSecrets"
    set:
      common:
        imagePullSecrets:
          - registry-credentials
    asserts:
      - equal:
          path: "spec.template.spec.imagePullSecrets"
          value:
            - name: registry-credentials

  - it: "should render common.imagePullPolicy on every workload"
    set:
      common:
        imagePullPolicy: Always
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].imagePullPolicy"
          value: Always

  # common has no imageRegistry: only global and the workload image.registry set it.
  - it: "should ignore common.imageRegistry"
    set:
      common:
        imageRegistry: common.example.com
    asserts:
      - matchRegex:
          path: "spec.template.spec.containers[0].image"
          pattern: "^ghcr\\.io/"

  - it: "should render common.labels on every workload"
    set:
      common:
        labels:
          team: security
    asserts:
      - equal:
          path: "metadata.labels.team"
          value: security
      - notExists:
          path: "spec.template.metadata.labels.team"

  - it: "should render common.annotations on every workload"
    set:
      common:
        annotations:
          example.com/owner: security
    asserts:
      - equal:
          path: "metadata.annotations[\"example.com/owner\"]"
          value: security
      - notExists:
          path: "spec.template.metadata.annotations"

  - it: "should render common.podLabels on every workload"
    set:
      common:
        podLabels:
          team: security
    asserts:
      - equal:
          path: "spec.template.metadata.labels.team"
          value: security
      - notExists:
          path: "metadata.labels.team"

  - it: "should render common.podAnnotations on every workload"
    set:
      common:
        podAnnotations:
          example.com/owner: security
    asserts:
      - equal:
          path: "spec.template.metadata.annotations[\"example.com/owner\"]"
          value: security

  - it: "should render common.affinity on every workload"
    set:
      common:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/arch
                      operator: In
                      values: [amd64]
    asserts:
      - equal:
          path: "spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key"
          value: kubernetes.io/arch

  - it: "should render common.topologySpreadConstraints on every workload"
    set:
      common:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
    asserts:
      - equal:
          path: "spec.template.spec.topologySpreadConstraints"
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway

  - it: "should render common.priorityClassName on every workload"
    set:
      common:
        priorityClassName: system-cluster-critical
    asserts:
      - equal:
          path: "spec.template.spec.priorityClassName"
          value: system-cluster-critical

  - it: "should render common.extraEnvFrom on every workload"
    set:
      common:
        extraEnvFrom:
          - configMapRef:
              name: proxy-env
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].envFrom"
          value:
            - configMapRef:
                name: proxy-env

  - it: "should render common.extraVolumes on every workload"
    set:
      common:
        extraVolumes:
          - name: extra-ca
            configMap:
              name: extra-ca
    asserts:
      - contains:
          path: "spec.template.spec.volumes"
          content:
            name: extra-ca
            configMap:
              name: extra-ca

  - it: "should render common.extraVolumeMounts on every workload"
    set:
      common:
        extraVolumeMounts:
          - name: extra-ca
            mountPath: /etc/extra-ca
            readOnly: true
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].volumeMounts"
          content:
            name: extra-ca
            mountPath: /etc/extra-ca
            readOnly: true
