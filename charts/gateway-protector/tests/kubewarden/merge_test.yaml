suite: "Values contract: resolution rules"
templates:
  - "templates/controller/deployment.yaml"
tests:
  - it: "should prefer the workload value, then common, then global for a scalar"
    set:
      global:
        logLevel: error
      common:
        logLevel: warn
      controller:
        logLevel: debug
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].args"
          content: "--log-level=debug"

  - it: "should prefer common over global for a scalar"
    set:
      global:
        logLevel: error
      common:
        logLevel: warn
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].args"
          content: "--log-level=warn"

  - it: "should fall back to global when the workload value is empty"
    set:
      global:
        logLevel: error
      controller:
        logLevel: ""
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].args"
          content: "--log-level=error"

  - it: "should merge maps, with the workload value winning on a duplicate key"
    set:
      global:
        nodeSelector:
          a: "1"
          b: "1"
      controller:
        nodeSelector:
          b: "2"
    asserts:
      - equal:
          path: "spec.template.spec.nodeSelector"
          value:
            a: "1"
            b: "2"

  - it: "should append named lists after the chart entries, in the order global, common, workload"
    set:
      global:
        extraEnv:
          - name: A
            value: a
      common:
        extraEnv:
          - name: C
            value: c
      controller:
        extraEnv:
          - name: B
            value: b
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].env"
          value:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: A
              value: a
            - name: C
              value: c
            - name: B
              value: b

  - it: "should replace unnamed lists with the most specific value"
    set:
      global:
        tolerations:
          - key: from-global
            operator: Exists
      controller:
        tolerations:
          - key: from-controller
            operator: Exists
    asserts:
      - equal:
          path: "spec.template.spec.tolerations"
          value:
            - key: from-controller
              operator: Exists

  - it: "should keep the fixed chart labels and the selector"
    release:
      name: rel
    set:
      global:
        labels:
          app.kubernetes.io/name: other
        podLabels:
          app.kubernetes.io/name: other
    asserts:
      - equal:
          path: "metadata.labels[\"app.kubernetes.io/name\"]"
          value: gateway-protector
      - equal:
          path: "spec.template.metadata.labels[\"app.kubernetes.io/name\"]"
          value: gateway-protector
      - equal:
          path: "spec.selector.matchLabels"
          value:
            app.kubernetes.io/name: gateway-protector
            app.kubernetes.io/instance: rel
            app.kubernetes.io/component: controller

  - it: "should prefer global.imageRegistry over the workload image.registry"
    set:
      global:
        imageRegistry: global.example.com
      controller:
        image:
          registry: mirror.example.com
    asserts:
      - matchRegex:
          path: "spec.template.spec.containers[0].image"
          pattern: "^global\\.example\\.com/kubewarden/gateway-protector/"

  - it: "should use the workload image.registry when global.imageRegistry is empty"
    set:
      controller:
        image:
          registry: mirror.example.com
    asserts:
      - matchRegex:
          path: "spec.template.spec.containers[0].image"
          pattern: "^mirror\\.example\\.com/kubewarden/gateway-protector/"

  - it: "should append imagePullSecrets: global, then common, then the workload"
    set:
      global:
        imagePullSecrets:
          - name: global-secret
      common:
        imagePullSecrets:
          - name: common-secret
      controller:
        imagePullSecrets:
          - name: controller-secret
    asserts:
      - equal:
          path: "spec.template.spec.imagePullSecrets"
          value:
            - name: global-secret
            - name: common-secret
            - name: controller-secret

  - it: "should accept names and maps on all levels of imagePullSecrets"
    set:
      global:
        imagePullSecrets:
          - global-secret
      common:
        imagePullSecrets:
          - name: common-secret
          - common-name
      controller:
        imagePullSecrets:
          - controller-secret
    asserts:
      - equal:
          path: "spec.template.spec.imagePullSecrets"
          value:
            - name: global-secret
            - name: common-secret
            - name: common-name
            - name: controller-secret
---
# gateway-protector cases
suite: "Values contract: resolution rules across workloads"
templates:
  - "templates/controller/deployment.yaml"
  - "templates/processor/deployment.yaml"
release:
  name: rel
tests:
  - it: "should fall back past an empty scalar at workload and common"
    set:
      global:
        logLevel: error
        imagePullPolicy: Never
      common:
        logLevel: ""
        imagePullPolicy: ""
      controller:
        logLevel: ""
        image:
          pullPolicy: ""
    asserts:
      - contains:
          path: "spec.template.spec.containers[0].args"
          content: "--log-level=error"
      - equal:
          path: "spec.template.spec.containers[0].imagePullPolicy"
          value: Never

  - it: "should prefer the workload image.pullPolicy over common and global"
    set:
      global:
        imagePullPolicy: Never
      common:
        imagePullPolicy: IfNotPresent
      controller:
        image:
          pullPolicy: Always
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].imagePullPolicy"
          value: Always
        template: "templates/controller/deployment.yaml"
      - equal:
          path: "spec.template.spec.containers[0].imagePullPolicy"
          value: IfNotPresent
        template: "templates/processor/deployment.yaml"

  - it: "should replace unnamed lists with the most specific value"
    set:
      global:
        tolerations:
          - key: from-global
            operator: Exists
      common:
        tolerations:
          - key: from-common
            operator: Exists
      controller:
        tolerations:
          - key: from-controller
            operator: Exists
    asserts:
      - equal:
          path: "spec.template.spec.tolerations"
          value:
            - key: from-controller
              operator: Exists
        template: "templates/controller/deployment.yaml"
      - equal:
          path: "spec.template.spec.tolerations"
          value:
            - key: from-common
              operator: Exists
        template: "templates/processor/deployment.yaml"

  - it: "should fall back past an empty unnamed list at workload and common"
    set:
      global:
        tolerations:
          - key: from-global
            operator: Exists
        topologySpreadConstraints:
          - maxSkew: 2
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
      common:
        tolerations: []
        topologySpreadConstraints: []
      controller:
        tolerations: []
        topologySpreadConstraints: []
    asserts:
      - equal:
          path: "spec.template.spec.tolerations"
          value:
            - key: from-global
              operator: Exists
      - equal:
          path: "spec.template.spec.topologySpreadConstraints[0].maxSkew"
          value: 2

  - it: "should merge maps, with the workload value winning on a duplicate key"
    set:
      global:
        nodeSelector:
          a: "1"
          b: "1"
          c: "1"
      common:
        nodeSelector:
          b: "2"
          c: "2"
      controller:
        nodeSelector:
          c: "3"
    asserts:
      - equal:
          path: "spec.template.spec.nodeSelector"
          value:
            a: "1"
            b: "2"
            c: "3"
        template: "templates/controller/deployment.yaml"
      - equal:
          path: "spec.template.spec.nodeSelector"
          value:
            a: "1"
            b: "2"
            c: "2"
        template: "templates/processor/deployment.yaml"

  - it: "should merge nested affinity maps across global, common, and workload"
    set:
      global:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/os
                      operator: In
                      values: [linux]
      common:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 10
                preference:
                  matchExpressions:
                    - key: example.com/pool
                      operator: In
                      values: [system]
      controller:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
    asserts:
      - equal:
          path: "spec.template.spec.affinity"
          value:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/os
                        operator: In
                        values: [linux]
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 10
                  preference:
                    matchExpressions:
                      - key: example.com/pool
                        operator: In
                        values: [system]
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
        template: "templates/controller/deployment.yaml"
      - equal:
          path: "spec.template.spec.affinity"
          value:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/os
                        operator: In
                        values: [linux]
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 10
                  preference:
                    matchExpressions:
                      - key: example.com/pool
                        operator: In
                        values: [system]
        template: "templates/processor/deployment.yaml"

  - it: "should order extraEnv, extraVolumes, and extraVolumeMounts as chart, global, common, workload"
    set:
      global:
        extraEnv:
          - name: A
            value: a
        extraVolumes:
          - name: vol-a
            emptyDir: {}
        extraVolumeMounts:
          - name: vol-a
            mountPath: /a
      common:
        extraEnv:
          - name: C
            value: c
        extraVolumes:
          - name: vol-c
            emptyDir: {}
        extraVolumeMounts:
          - name: vol-c
            mountPath: /c
      processor:
        extraEnv:
          - name: B
            value: b
        extraVolumes:
          - name: vol-b
            emptyDir: {}
        extraVolumeMounts:
          - name: vol-b
            mountPath: /b
    template: "templates/processor/deployment.yaml"
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].env"
          value:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: A
              value: a
            - name: C
              value: c
            - name: B
              value: b
      - equal:
          path: "spec.template.spec.volumes[0].name"
          value: tmp
      - equal:
          path: "spec.template.spec.volumes[1].name"
          value: config-stream-certs
      - equal:
          path: "spec.template.spec.volumes[2].name"
          value: ext-proc-certs
      - equal:
          path: "spec.template.spec.volumes[3]"
          value:
            name: vol-a
            emptyDir: {}
      - equal:
          path: "spec.template.spec.volumes[4]"
          value:
            name: vol-c
            emptyDir: {}
      - equal:
          path: "spec.template.spec.volumes[5]"
          value:
            name: vol-b
            emptyDir: {}
      - lengthEqual:
          path: "spec.template.spec.volumes"
          count: 6
      - equal:
          path: "spec.template.spec.containers[0].volumeMounts[3]"
          value:
            name: vol-a
            mountPath: /a
      - equal:
          path: "spec.template.spec.containers[0].volumeMounts[4]"
          value:
            name: vol-c
            mountPath: /c
      - equal:
          path: "spec.template.spec.containers[0].volumeMounts[5]"
          value:
            name: vol-b
            mountPath: /b
      - lengthEqual:
          path: "spec.template.spec.containers[0].volumeMounts"
          count: 6

  - it: "should skip empty and missing imagePullSecrets names"
    set:
      global:
        imagePullSecrets:
          - ""
          - {}
          - name: ""
          - other: x
          - name: real-secret
    asserts:
      - equal:
          path: "spec.template.spec.imagePullSecrets"
          value:
            - name: real-secret

  - it: "should render no registry prefix when every registry is empty"
    set:
      controller:
        image:
          registry: ""
          tag: 1.0.0
    template: "templates/controller/deployment.yaml"
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].image"
          value: "kubewarden/gateway-protector/controller:1.0.0"

  - it: "should keep spec.selector.matchLabels with hostile labels and podLabels"
    set:
      global:
        labels: &hostile
          app.kubernetes.io/name: other
          app.kubernetes.io/instance: other
          app.kubernetes.io/component: other
        podLabels: *hostile
      common:
        labels: *hostile
        podLabels: *hostile
      controller:
        labels: *hostile
        podLabels: *hostile
      processor:
        labels: *hostile
        podLabels: *hostile
    asserts:
      - equal:
          path: "spec.selector.matchLabels"
          value:
            app.kubernetes.io/name: gateway-protector
            app.kubernetes.io/instance: rel
            app.kubernetes.io/component: controller
        template: "templates/controller/deployment.yaml"
      - equal:
          path: "spec.selector.matchLabels"
          value:
            app.kubernetes.io/name: gateway-protector
            app.kubernetes.io/instance: rel
            app.kubernetes.io/component: processor
        template: "templates/processor/deployment.yaml"
      - equal:
          path: "spec.template.metadata.labels[\"app.kubernetes.io/name\"]"
          value: gateway-protector
      - equal:
          path: "spec.template.metadata.labels[\"app.kubernetes.io/instance\"]"
          value: rel
      - equal:
          path: "metadata.labels[\"app.kubernetes.io/name\"]"
          value: gateway-protector
      - equal:
          path: "metadata.labels[\"app.kubernetes.io/instance\"]"
          value: rel
      - equal:
          path: "spec.template.metadata.labels[\"app.kubernetes.io/component\"]"
          value: controller
        template: "templates/controller/deployment.yaml"
      - equal:
          path: "spec.template.metadata.labels[\"app.kubernetes.io/component\"]"
          value: processor
        template: "templates/processor/deployment.yaml"
