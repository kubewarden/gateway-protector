suite: "Values contract: ServiceAccounts"
templates:
  - "templates/controller/serviceaccount.yaml"
  - "templates/processor/serviceaccount.yaml"
tests:
  - it: "should render global.serviceAccount.annotations on every ServiceAccount"
    set:
      global:
        serviceAccount:
          annotations:
            example.com/role: scanner
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: "metadata.annotations[\"example.com/role\"]"
          value: scanner

  # gateway-protector cases
  - it: "should render no ServiceAccount annotations by default"
    asserts:
      - notExists:
          path: "metadata.annotations"

  - it: "should render common.serviceAccount.annotations on every ServiceAccount"
    set:
      common:
        serviceAccount:
          annotations:
            example.com/role: common
    asserts:
      - equal:
          path: "metadata.annotations[\"example.com/role\"]"
          value: common

  - it: "should render a workload serviceAccount.annotations on its own ServiceAccount only"
    set:
      processor:
        serviceAccount:
          annotations:
            example.com/role: processor
    asserts:
      - equal:
          path: "metadata.annotations[\"example.com/role\"]"
          value: processor
        template: "templates/processor/serviceaccount.yaml"
      - notExists:
          path: "metadata.annotations"
        template: "templates/controller/serviceaccount.yaml"

  - it: "should merge serviceAccount.annotations, with the workload winning on a duplicate key"
    set:
      global:
        serviceAccount:
          annotations:
            example.com/role: global
            example.com/global: "yes"
      common:
        serviceAccount:
          annotations:
            example.com/role: common
            example.com/common: "yes"
      controller:
        serviceAccount:
          annotations:
            example.com/role: controller
    asserts:
      - equal:
          path: "metadata.annotations"
          value:
            example.com/role: controller
            example.com/global: "yes"
            example.com/common: "yes"
        template: "templates/controller/serviceaccount.yaml"
      - equal:
          path: "metadata.annotations"
          value:
            example.com/role: common
            example.com/global: "yes"
            example.com/common: "yes"
        template: "templates/processor/serviceaccount.yaml"

  # The processor does not call the Kubernetes API.
  - it: "should not mount an API token from the processor ServiceAccount"
    template: "templates/processor/serviceaccount.yaml"
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
