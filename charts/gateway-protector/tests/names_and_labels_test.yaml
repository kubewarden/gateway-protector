suite: names and labels
templates:
  - controller/deployment.yaml
  - processor/deployment.yaml
release:
  name: gateway-protector
  namespace: gateway-protector-system
tests:
  - it: should name the objects after the release
    release:
      name: custom-release
    asserts:
      - template: controller/deployment.yaml
        equal:
          path: metadata.name
          value: custom-release-gateway-protector-controller
      - template: processor/deployment.yaml
        equal:
          path: metadata.name
          value: custom-release-gateway-protector-processor

  - it: should not repeat the chart name when the release name contains it
    asserts:
      - template: controller/deployment.yaml
        equal:
          path: metadata.name
          value: gateway-protector-controller

  - it: should use fullnameOverride as the prefix of the names
    set:
      fullnameOverride: custom-fullname
    asserts:
      - template: controller/deployment.yaml
        equal:
          path: metadata.name
          value: custom-fullname-controller
      - template: controller/deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: custom-fullname-controller

  - it: should use nameOverride in the names and in the name label
    release:
      name: custom-release
    set:
      nameOverride: custom-name
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: custom-name
      - template: processor/deployment.yaml
        equal:
          path: metadata.name
          value: custom-release-custom-name-processor

  - it: should set the version labels from the chart
    chart:
      version: 9.9.9
      appVersion: v9.9.9
    asserts:
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: gateway-protector-9.9.9
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: v9.9.9

  - it: should set the common labels
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: gateway-protector
            app.kubernetes.io/instance: gateway-protector
            app.kubernetes.io/part-of: gateway-protector
            app.kubernetes.io/managed-by: Helm
