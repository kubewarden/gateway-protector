processor:
  # RE2 regular expressions describing types that should be excluded from the generated documentation.
  ignoreTypes: []
  # RE2 regular expressions describing type fields that should be excluded from the generated documentation.
  ignoreFields:
    - "TypeMeta$"

render:
  # Version of Kubernetes to use when generating links to Kubernetes API documentation.
  # renovate: datasource=github-releases depName=kubernetes/kubernetes extractVersion=^v(?<version>\d+\.\d+)\.\d+$
  kubernetesVersion: "1.37"
  # Gateway API types that the API uses but does not define. Without these
  # entries, the generator links to sections that do not exist. The links
  # point to the main branch of the Gateway API reference, so they do not
  # change when go.mod updates sigs.k8s.io/gateway-api.
  knownTypes:
    - name: Group
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#group
    - name: Kind
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#kind
    - name: Namespace
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#namespace
    - name: ObjectName
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#objectname
    - name: SectionName
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://gateway-api.sigs.k8s.io/reference/api-spec/main/spec/#sectionname
