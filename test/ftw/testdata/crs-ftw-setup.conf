# The complete SecLang directive block compiled for the go-ftw regression
# suite's own Coraza engine (see test/ftw's TestCRSRegression, which
# embeds this file as crsFTWDirectives and passes it to config.Compile
# verbatim).
#
# The skeleton (Include @coraza.conf-recommended, SecRuleEngine,
# Include @crs-setup.conf.example, Include @owasp_crs/*.conf) matches the
# order production renders the same four pieces in (see RenderDirectives,
# internal/controller/processorconfig/directives.go) - this suite's own
# tx.* setup is spliced between crs-setup and the rule files instead of
# after them (production's spot for custom rules), because the CRS
# regression suite's own requirements need those tx.* values in place
# before the rule files load (see the setvar block below).
#
# The tx.* setvar block and the SecResponseBodyMimeType override are
# adapted from coraza-envoy-go-filter's ftw setup
# (https://github.com/anomalyco/coraza-envoy-go-filter, Apache-2.0),
# which traces them to the CRS regression suite's own requirements
# (https://github.com/coreruleset/coreruleset/blob/v4.0/dev/tests/regression/README.md#requirements).

Include @coraza.conf-recommended
SecRuleEngine DetectionOnly

# Overrides the default SecResponseBodyMimeType (set by
# @coraza.conf-recommended above) to add application/json: albedo, the ftw
# test corpus's own upstream, replies with that Content-Type, and several
# CRS response-body tests (95x) need Coraza to actually inspect it.
SecResponseBodyMimeType text/plain text/html text/xml application/json

Include @crs-setup.conf.example

# go-ftw detects which rule fired purely by correlating the request's
# X-CRS-Test marker (see the id:999999 rule below) against matched-rule log
# lines (see --waf-matched-rules-log in cmd/processor). Every phase needs an
# explicit default "log" action for that correlation to work at all: a rule
# with neither "log" nor "nolog" only gets logged if a SecDefaultAction for
# its phase says so, and CRS itself doesn't set one.
#
# Phases 1 and 2 are NOT set here: the Include @crs-setup.conf.example line
# above already sets the identical "phase:1,log,auditlog,pass"/
# "phase:2,log,auditlog,pass" - and Coraza rejects a second
# SecDefaultAction for a phase that already has one ("SecDefaultAction
# already defined for this phase"). Only phases 3-5, which
# @crs-setup.conf.example leaves unset, are declared here.
SecDefaultAction "phase:3,log,auditlog,pass"
SecDefaultAction "phase:4,log,auditlog,pass"
SecDefaultAction "phase:5,log,auditlog,pass"

# REQUEST-901-INITIALIZATION.conf (in @owasp_crs/*.conf, included below)
# sets tx.crs_setup_version itself only if it's still unset - but the
# Include @crs-setup.conf.example line above already sets it
# unconditionally via its own rule id 900990. Redeclaring it here would be
# both redundant and a compile error (Coraza rejects a duplicate rule id).

# The tx.* values below are exactly what the CRS regression suite's own
# README documents as required to exercise the full rule set (paranoia
# level 4, so PL2-4-only rules run; the arg/file-size limits several
# 920xxx REQUEST-920-PROTOCOL-ENFORCEMENT tests are written against).
# ctl:ruleEngine=DetectionOnly additionally makes rule matches visible
# purely through logging (see the doc comment above
# newErrorCallback/WithMatchedRuleWriter in
# internal/processor/config/compile.go) without this processor's own
# blocking/withholding logic ever needing to run - go-ftw verifies which
# rule fired by parsing that log, not by asserting on the HTTP response,
# except for the handful of tests overrides.yml pins an expected status
# for.
SecAction "id:900005,\
  phase:1,\
  nolog,\
  pass,\
  ctl:ruleEngine=DetectionOnly,\
  ctl:ruleRemoveById=910000,\
  setvar:tx.blocking_paranoia_level=4,\
  setvar:tx.crs_validate_utf8_encoding=1,\
  setvar:tx.arg_name_length=100,\
  setvar:tx.arg_length=400,\
  setvar:tx.total_arg_length=64000,\
  setvar:tx.max_num_args=255,\
  setvar:tx.max_file_size=64100,\
  setvar:tx.combined_file_sizes=65535"

# go-ftw brackets every test's request with a unique X-CRS-Test marker
# header and expects it to reach this log unmolested: this rule logs it
# (ctl:ruleRemoveById=1-999999 disables every other rule for the request
# that carries it, so the marker request itself never triggers unrelated
# CRS rules that would otherwise pollute the correlation).
SecRule REQUEST_HEADERS:X-CRS-Test "@rx ^.*$" \
  "id:999999,\
  phase:1,\
  pass,\
  t:none,\
  log,\
  msg:'X-CRS-Test %{MATCHED_VAR}',\
  severity:'CRITICAL',\
  ctl:ruleRemoveById=1-999999"

Include @owasp_crs/*.conf
