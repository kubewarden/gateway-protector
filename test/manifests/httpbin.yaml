apiVersion: v1
kind: Namespace
metadata:
  name: httpbin
---
##################################################################################################
# httpbin service - adapted from
# https://raw.githubusercontent.com/kgateway-dev/kgateway/refs/heads/v2.4.x/examples/httpbin.yaml
# (also agentgateway's own recommended sample app - see
# https://agentgateway.dev/docs/kubernetes/latest/install/sample-app/), plus the Gateway/HTTPRoute
# wiring it through agentgateway. Shared by the Tiltfile (local dev) and, eventually,
# test/e2e (test/e2e doesn't exist yet - see the test-e2e Makefile target).
##################################################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: httpbin
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: httpbin
  labels:
    app: httpbin
    service: httpbin
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8080
    - name: tcp
      port: 9000
  selector:
    app: httpbin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: httpbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
      version: v1
  template:
    metadata:
      labels:
        app: httpbin
        version: v1
    spec:
      serviceAccountName: httpbin
      containers:
        - image: docker.io/mccutchen/go-httpbin:2.26.0
          imagePullPolicy: IfNotPresent
          name: httpbin
          command: [go-httpbin]
          args:
            - "-port"
            - "8080"
            - "-max-duration"
            - "600s" # override default 10s
          ports:
            - containerPort: 8080
        - name: curl
          # Kept around so a shell (Tilt or e2e) can exec in and curl the
          # gateway/httpbin from inside the cluster network, without
          # needing a port-forward.
          image: curlimages/curl:8.23.0
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "200m"
          imagePullPolicy: IfNotPresent
          command:
            - "tail"
            - "-f"
            - "/dev/null"
---
##################################################################################################
# Gateway + HTTPRoute wiring httpbin through agentgateway. No hostnames are
# set on the HTTPRoute, so it registers as the catch-all "*" host in the
# processor's routing table (see docs/processor.md) - no Host header
# needed when testing through a port-forward.
##################################################################################################
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: httpbin-gateway
  namespace: httpbin
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  namespace: httpbin
spec:
  parentRefs:
    - name: httpbin-gateway
  rules:
    - backendRefs:
        - name: httpbin
          port: 8000
